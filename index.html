<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Замок со словом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: одна сцена — латунный замок на тёмной стали, поле ввода под ним, тайна открывается ниже */
:root{
  --bg:#12171d;
  --steel:#1c242d;
  --line:#2c3743;
  --fg:#e9e3d6;
  --muted:#8d97a1;
  --brass:#d2a24c;
  --brass-hi:#f3d48f;
  --brass-lo:#8a6424;
  --bad:#e0685a;
  --good:#8fc79a;
  --f-display:"Prata", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 70% 50% at 50% 30%, #1f2a35 0%, transparent 70%);
  color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:16px;padding-block:32px 48px;
}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1.05;margin:6px 0 0;text-wrap:balance}
.lede{color:var(--muted);margin:10px 0 0;max-width:38ch}

.stage{position:relative;width:min(70vw,270px);aspect-ratio:200/285;max-width:100%;perspective:700px}
.stage svg{width:100%;height:100%;overflow:visible;display:block;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}

#shackle{transition:transform .7s cubic-bezier(.3,1.6,.5,1);transform-box:view-box;transform-origin:60px 120px}
.open #shackle{transform:translateY(-34px) scaleX(-1);transition-duration:.9s}
#bear{transform-box:view-box;transform:translate(35px,170px);transition:transform 1s cubic-bezier(.3,1.45,.5,1) .55s}
.open #bear{transform:translate(35px,22px)}
#bear-inner{transform-box:view-box}
.open #bear-inner{animation:bob 2.6s ease-in-out 1.7s infinite}
@keyframes bob{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}
#bear-inner{transform-origin:100px 200px}
#note{transform-box:fill-box;transform-origin:50% 50%;transform:scale(.15);opacity:0;transition:transform .6s cubic-bezier(.3,1.6,.5,1) 1.45s,opacity .3s 1.45s}
.open #note{transform:scale(1);opacity:1}
#shackle-wrap,#lockfront{transform-box:view-box;transform-origin:100px 190px;transition:transform 1s cubic-bezier(.55,0,.9,.5),opacity .5s .5s}
.fall #shackle-wrap,.fall #lockfront{transform:translateY(460px) rotate(22deg);opacity:0}
.fall #shackle-wrap{transform:translateY(470px) rotate(-30deg)}
#sparkles path{opacity:0;transform-box:fill-box;transform-origin:center}
.landed #sparkles path{animation:twinkle 2.2s ease-in-out infinite}
.landed #sparkles path:nth-child(2){animation-delay:.4s}
.landed #sparkles path:nth-child(3){animation-delay:.9s}
.landed #sparkles path:nth-child(4){animation-delay:1.3s}
.landed #sparkles path:nth-child(5){animation-delay:.7s}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
#cloud{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.3);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.landed #cloud{opacity:1;transform:scale(1);transition:transform .6s cubic-bezier(.3,1.6,.5,1) .8s,opacity .3s .8s;animation:cloudfloat 3.4s ease-in-out 1.5s infinite}
@keyframes cloudfloat{0%,100%{translate:0 0}50%{translate:0 -4px}}
.landed #bear{transform:translate(35px,72px);transition:transform .7s cubic-bezier(.4,1.6,.5,1)}

#key{opacity:0;transform-box:view-box;transform-origin:100px 168px;transform:translate(70px,-90px) scale(1.9) rotate(-35deg)}
.inserting #key,.turning #key,.open #key{opacity:1;transform:none;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .3s}
.turning #key,.open #key{transform:rotate(90deg);transition:transform .45s cubic-bezier(.5,0,.3,1.3)}

#body{transform-box:view-box;transform-origin:100px 180px}
.shake #body,.shake #shackle-wrap{animation:shake .45s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px) rotate(-2deg)}
  40%{transform:translateX(8px) rotate(2deg)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(3px)}
}
#glow{opacity:0;transition:opacity .8s}
.open #glow{opacity:1}
#ring{opacity:0;transform-box:view-box;transform-origin:100px 168px}
.open #ring{animation:ring 1.1s ease-out .1s}
@keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(3.2)}}

.wrap{min-height:calc(100vh - 80px);justify-content:center}
form{display:flex;flex-direction:column;gap:14px;width:100%}
.q{font-family:var(--f-display);font-size:clamp(24px,6vw,32px);line-height:1.2;text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row input{flex:1 1 200px;min-width:0}
input{
  width:100%;box-sizing:border-box;font:500 18px var(--f-mono);letter-spacing:.06em;
  background:var(--steel);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;
  padding:14px 16px;outline:none;transition:border-color .2s, box-shadow .2s;text-align:center;
}
input::placeholder{color:#5c6772;letter-spacing:.02em}
input:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(210,162,76,.2)}
input.bad{border-color:var(--bad)}
button{
  font:600 16px var(--f-body);border:0;border-radius:10px;padding:14px 22px;cursor:pointer;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,var(--brass-lo));color:#241808;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 18px -8px rgba(210,162,76,.6);
  transition:transform .12s, filter .2s;flex:0 0 auto;
}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
button:disabled{filter:grayscale(.6) brightness(.7);cursor:default}
.ghost{background:transparent;color:var(--brass);box-shadow:inset 0 0 0 1.5px var(--line)}

.status{min-height:1.6em;font-size:15px;color:var(--muted);margin:-12px 0 0}
.status.bad{color:var(--bad)}
.status.good{color:var(--good)}
.meta{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.meta b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
details{color:var(--muted);font-size:14px}
summary{cursor:pointer;color:var(--brass)}
summary:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}

.secret{
  width:100%;box-sizing:border-box;padding:24px 22px;border-radius:14px;
  background:linear-gradient(180deg,#1e2730,#171e25);border:1px solid var(--line);
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
.secret h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 8px;color:var(--brass-hi)}
.secret p{margin:0 0 18px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

</head>

      <g id="key">
        <rect x="96" y="150" width="8" height="34" rx="2" fill="url(#keyG)" stroke="#7a561c" stroke-width=".8"/>
        <rect x="97" y="152" width="2" height="30" rx="1" fill="#fff6d8" opacity=".7"/>
        <circle cx="100" cy="132" r="17" fill="url(#keyG)" stroke="#7a561c" stroke-width="1.5"/>
        <circle cx="100" cy="132" r="13.5" fill="none" stroke="#fff6d8" stroke-opacity=".5" stroke-width="1.2"/>
        <circle cx="100" cy="132" r="6.5" fill="#12171d" stroke="#7a561c" stroke-width="1"/>
        <rect x="92.5" y="146" width="15" height="5" rx="2" fill="#c8963f" stroke="#7a561c" stroke-width=".6"/>
      </g>
      </g>
    </svg>
  </div>

  <form id="form" autocomplete="off">
    <label for="word" class="q">Кто очень красивая девушка?</label>
    <div class="row">
      <input id="word" name="word" spellcheck="false" autocapitalize="off" required>
      <button id="go" type="submit">Открыть</button>
    </div>
  </form>
</main>

<script>
// Кодовое слово: поменяй здесь. Регистр, пробелы и ё/е не важны.
const SECRETS = ["Милана", "Я"];

const norm = s => s.trim().toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ");
const stage = document.getElementById("stage");
const form = document.getElementById("form");
const input = document.getElementById("word");
const go = document.getElementById("go");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy = false;
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

form.addEventListener("submit", async e => {
  e.preventDefault();
  if (busy) return;
  const v = norm(input.value);
  if (!v) return;

  if (!SECRETS.some(s => norm(s) === v)) {
    input.classList.add("bad");
    stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
    input.select();
    return;
  }

  busy = true; go.disabled = true; input.disabled = true;
  input.classList.remove("bad");
  stage.classList.add("inserting"); await wait(750);
  stage.classList.add("turning");   await wait(480);
  stage.classList.add("open");
  await wait(2100);
  stage.classList.add("fall");
  await wait(750);
  stage.classList.add("landed");
});

input.addEventListener("input", () => input.classList.remove("bad"));

if (!reduce) addEventListener("pointermove", e => {
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  stage.style.setProperty("--ry", (x * 18).toFixed(2) + "deg");
  stage.style.setProperty("--rx", (-y * 12).toFixed(2) + "deg");
});
</script>

</body>
</html>
